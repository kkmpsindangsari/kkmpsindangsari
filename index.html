<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
  <title>KKMP Sindangsari</title>

  <link rel="manifest" href="manifest.json"/>

  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="KKMP Sindangsari"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>

  <meta name="theme-color" content="#ffffff"/>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    iframe { border: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <iframe
    allow="camera; microphone; geolocation; fullscreen"
    allowfullscreen="true"
    src="https://script.google.com/macros/s/AKfycbzX4EbLLdKhcMRfKXKCcAzR8cx3wIVrVyGnGFHCaMCMrJa2qK032bg9DYnKzBn0oWwF/exec">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
